spring.data.mongodb.uri=mongodb://localhost:27017/skysync
spring.data.mongodb.auto-index-creation=true

server.servlet.context-path=/api/v1.0

# Disable default generated user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# CORS (we'll also configure via Java, but this helps)
# Frontend is on Vite default port:
frontend.origin=http://localhost:5173

# Clerk config (replace with your actual values)
clerk.issuer=https://close-dog-50.clerk.accounts.dev
clerk.jwks-url=https://close-dog-50.clerk.accounts.dev/.well-known/jwks.json
# You can leave this empty or set if you really know what audience is
 clerk.audience=skysync-backend

# Razorpay config (dummy here, replace with real)
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret
